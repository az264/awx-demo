- name: Install Apache on all servers
  hosts: all
  become: yes

  tasks:
    - name: Install Apache (RHEL)
      package:
        name: httpd
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install Apache (Debian)
      package:
        name: apache2
        state: present
      when: ansible_os_family == "Debian"

    - name: Start Apache (RHEL)
      service:
        name: httpd
        state: started
        enabled: true
      when: ansible_os_family == "RedHat"

    - name: Start Apache (Debian)
      service:
        name: apache2
        state: started
        enabled: true
      when: ansible_os_family == "Debian"

    - name: Create demo web page
      copy:
        content: "Apache installed via AWX"
        dest: /var/www/html/index.html
